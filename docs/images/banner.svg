<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title">
  <title id="title">Pianova: a piano you play with your computer keyboard</title>
  <defs>
    <clipPath id="frame"><rect width="960" height="360" rx="20" /></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="near" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="near" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="line-glow" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" />
    </filter>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ff2a2a" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#d5cebf" />
    </linearGradient>
    <!-- One octave of keys, 7 white keys 24 wide: black keys after C, D, F, G and A. -->
    <pattern id="keys" x="0" y="290" width="168" height="70" patternUnits="userSpaceOnUse">
      <rect width="168" height="70" fill="url(#ivory)" />
      <rect x="23.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="47.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="71.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="95.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="119.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="143.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="167.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="16" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="42" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="88" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="113" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="138" width="14" height="40" rx="2" fill="#0e0f13" />
    </pattern>
    <!-- The mark: the grand piano of src/ui/Logo.tsx (LOGO_SHAPES), in the default light. -->
    <filter id="mark-glow" filterUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="near" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="near" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="case"><path d="M8 57.5V16C8 8.5 13 4.5 19.5 4.5 26 4.5 29.3 8.8 30.8 14.5 32.8 22.5 37.5 27.5 45.5 30.2 52.5 32.6 56 35 56 39V57.5Q56 59 54.5 59H9.5Q8 59 8 57.5Z" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="360" fill="#000" />

    <!-- Notes falling toward the keys, faint, on both sides of the name. -->
    <rect x="49" y="40" width="20" height="70" rx="6" fill="url(#fall)" />
    <rect x="121" y="130" width="20" height="96" rx="6" fill="url(#fall)" />
    <rect x="169" y="20" width="20" height="60" rx="6" fill="url(#fall)" />
    <rect x="241" y="170" width="20" height="80" rx="6" fill="url(#fall)" />
    <rect x="193" y="236" width="20" height="50" rx="6" fill="url(#fall)" />
