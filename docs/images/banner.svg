<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title">
  <title id="title">Pianova: a piano you play with your computer keyboard</title>
  <defs>
    <clipPath id="frame"><rect width="960" height="360" rx="20" /></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="near" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="near" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="line-glow" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="far" />
      <feMerge>
        <feMergeNode in="far" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" />
    </filter>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ff2a2a" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#d5cebf" />
    </linearGradient>
    <!-- One octave of keys, 7 white keys 24 wide: black keys after C, D, F, G and A. -->
    <pattern id="keys" x="0" y="290" width="168" height="70" patternUnits="userSpaceOnUse">
      <rect width="168" height="70" fill="url(#ivory)" />
      <rect x="23.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="47.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="71.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="95.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="119.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="143.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="167.5" width="1" height="70" fill="#bdb5a5" />
      <rect x="16" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="42" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="88" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="113" width="14" height="40" rx="2" fill="#0e0f13" />
      <rect x="138" width="14" height="40" rx="2" fill="#0e0f13" />
    </pattern>
    <!-- The mark: the same shapes as public/favicon.svg. -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c0000" />
      <stop offset="0.45" stop-color="#ff2a2a" />
      <stop offset="0.85" stop-color="#ff2a2a" />
      <stop offset="1" stop-color="#ffd4d4" />
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a2a" />
      <stop offset="1" stop-color="#8c0000" />
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="360" fill="#000" />

    <!-- Notes falling toward the keys, faint, on both sides of the name. -->
    <rect x="49" y="40" width="20" height="70" rx="6" fill="url(#fall)" />
    <rect x="121" y="130" width="20" height="96" rx="6" fill="url(#fall)" />
    <rect x="169" y="20" width="20" height="60" rx="6" fill="url(#fall)" />
    <rect x="241" y="170" width="20" height="80" rx="6" fill="url(#fall)" />
    <rect x="193" y="236" width="20" height="50" rx="6" fill="url(#fall)" />
    <rect x="697" y="60" width="20" height="88" rx="6" fill="url(#fall)" />
    <rect x="769" y="200" width="20" height="86" rx="6" fill="url(#fall)" />
    <rect x="817" y="24" width="20" height="74" rx="6" fill="url(#fall)" />
    <rect x="865" y="150" width="20" height="64" rx="6" fill="url(#fall)" />
    <rect x="913" y="236" width="20" height="50" rx="6" fill="url(#fall)" />

    <!-- The keys and the line of light above them. -->
    <rect x="0" y="290" width="960" height="70" fill="url(#keys)" />
    <rect x="0" y="287" width="960" height="3" fill="#ff2a2a" filter="url(#line-glow)" />

    <!-- The mark, centred above the name. -->
    <svg x="432" y="28" width="96" height="96" viewBox="0 0 64 64" overflow="visible">
      <path d="M6 43h15.5v15q0 3-3 3h-9.5q-3 0-3-3Z" fill="url(#ivory)" />
      <path d="M24.25 43h15.5v15q0 3-3 3h-9.5q-3 0-3-3Z" fill="url(#lit)" />
      <path d="M42.5 43h15.5v15q0 3-3 3h-9.5q-3 0-3-3Z" fill="url(#ivory)" />
      <path d="M24.25 43h15.5v2.5h-15.5Z" fill="#ffd4d4" opacity="0.55" />
      <path d="M18.875 43h8v9.5q0 1.5-1.5 1.5h-5q-1.5 0-1.5-1.5Z" fill="#0e0f13" stroke="#3b3e49" />
      <path d="M37.125 43h8v9.5q0 1.5-1.5 1.5h-5q-1.5 0-1.5-1.5Z" fill="#0e0f13" stroke="#3b3e49" />
      <g filter="url(#glow)">
        <path d="M4 40h56v2h-56Z" fill="#ff2a2a" />
        <path d="M32 3a5.5 5.5 0 0 1 5.5 5.5v22a5.5 5.5 0 0 1-11 0v-22A5.5 5.5 0 0 1 32 3Z" fill="url(#bar)" />
        <path d="M32 32Q33.7 39.3 45 41Q33.7 42.7 32 50Q30.3 42.7 19 41Q30.3 39.3 32 32Z" fill="#ffd4d4" />
        <circle cx="21" cy="35.5" r="1.1" fill="#ffd4d4" />
        <circle cx="44" cy="34.5" r="1.3" fill="#ffd4d4" />
        <circle cx="17.5" cy="38.5" r="0.8" fill="#ffd4d4" />
        <circle cx="47.5" cy="38" r="0.9" fill="#ffd4d4" />
      </g>
    </svg>

    <!-- The name: "Pia" in white, "nova" in the light. The first copy is only its glow. -->
    <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="76" text-anchor="middle">
      <text x="480" y="206" filter="url(#text-glow)"><tspan fill="#000" fill-opacity="0">Pia</tspan><tspan fill="#ff2a2a">nova</tspan></text>
      <text x="480" y="206"><tspan fill="#eceef4">Pia</tspan><tspan fill="#ff2a2a">nova</tspan></text>
    </g>
    <text x="480" y="248" fill="#9ba3b5" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" text-anchor="middle">A piano you play with your computer keyboard</text>
  </g>
</svg>
