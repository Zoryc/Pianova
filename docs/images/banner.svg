    <rect x="817" y="24" width="20" height="74" rx="6" fill="url(#fall)" />
    <rect x="865" y="150" width="20" height="64" rx="6" fill="url(#fall)" />
    <rect x="913" y="236" width="20" height="50" rx="6" fill="url(#fall)" />

    <!-- The keys and the line of light above them. -->
    <rect x="0" y="290" width="960" height="70" fill="url(#keys)" />
    <rect x="0" y="287" width="960" height="3" fill="#ff2a2a" filter="url(#line-glow)" />

